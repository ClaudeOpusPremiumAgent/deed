[workspace]
resolver = "2"
members = ["contracts/vault", "contracts/deed", "contracts/slow", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = { version = "=5.30.0", features = ["global-contracts"] }
near-contract-standards = "=5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
